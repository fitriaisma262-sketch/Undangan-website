<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Undangan Pernikahan</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase.js"></script>

<style>

/* ================= DASAR ================= */

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

html{
  scroll-behavior:smooth;
}

body{
  font-family:Arial,sans-serif;
  background:#f6efe3;
  color:#49352d;
  overflow-x:hidden;
}

section{
  padding:80px 20px;
}

.container{
  width:100%;
  max-width:700px;
  margin:auto;
}


/* ================= ORNAMEN SONGKET ================= */

.songket{
  position:absolute;
  width:120px;
  height:120px;
  opacity:.35;
  pointer-events:none;

  background:
    linear-gradient(45deg,
      transparent 40%,
      #c9a24a 41%,
      #c9a24a 48%,
      transparent 49%
    ),
    linear-gradient(-45deg,
      transparent 40%,
      #c9a24a 41%,
      #c9a24a 48%,
      transparent 49%
    );

  background-size:25px 25px;
}

.songket.top{
  top:0;
  left:0;
}

.songket.bottom{
  right:0;
  bottom:0;
  transform:rotate(180deg);
}


/* ================= COVER ================= */

.cover{
  position:fixed;
  inset:0;
  z-index:9999;

  display:flex;
  align-items:center;
  justify-content:center;

  padding:20px;

  text-align:center;

  background:
    radial-gradient(
      circle at 50% 30%,
      rgba(255,255,255,.9),
      transparent 35%
    ),
    #f4eadb;

  transition:1.2s ease;
}

.cover.hide{
  opacity:0;
  visibility:hidden;
  pointer-events:none;
}

.cover-card{
  position:relative;

  width:100%;
  max-width:430px;

  padding:50px 28px;

  border:1px solid rgba(201,162,74,.6);

  background:
    linear-gradient(
      145deg,
      #fffaf2,
      #f2e4d0
    );

  box-shadow:
    0 25px 80px rgba(70,40,20,.2);

  overflow:hidden;

  animation:coverIn 1.2s ease;
}

.cover-card:before,
.cover-card:after{
  content:"";
  position:absolute;

  width:90px;
  height:90px;

  border:2px solid #c9a24a;

  transform:rotate(45deg);
}

.cover-card:before{
  top:-55px;
  left:-55px;
}

.cover-card:after{
  bottom:-55px;
  right:-55px;
}

.bismillah{
  font-family:Georgia,serif;
  font-size:24px;
  margin-bottom:28px;
}

.cover-small{
  font-size:10px;
  letter-spacing:5px;
  color:#98743a;
  margin-bottom:20px;
}

.cover h1{
  font-family:Georgia,serif;
  font-weight:normal;
  color:#641f2b;
  font-size:48px;
  line-height:1.3;
}

.cover-date{
  margin-top:18px;
  color:#806b5c;
}

.open-btn{
  margin-top:30px;

  padding:14px 30px;

  border:1px solid #c9a24a;
  border-radius:30px;

  background:#641f2b;
  color:#fff;

  font-size:14px;

  cursor:pointer;

  box-shadow:0 8px 25px rgba(100,31,43,.25);

  transition:.3s;
}

.open-btn:hover{
  transform:translateY(-4px);
}


/* ================= MUSIK ================= */

.music-btn{
  position:fixed;
  right:18px;
  bottom:18px;

  z-index:500;

  width:48px;
  height:48px;

  border:1px solid #d6b96a;
  border-radius:50%;

  background:#641f2b;
  color:#fff;

  font-size:18px;

  display:none;
}


/* ================= HERO ================= */

.hero{
  position:relative;

  min-height:100vh;

  display:flex;
  align-items:center;
  justify-content:center;

  text-align:center;

  overflow:hidden;

  background:
    radial-gradient(
      circle at center,
      #fffaf2,
      #ead8bd
    );
}

.hero:before{
  content:"";

  position:absolute;
  inset:20px;

  border:1px solid rgba(201,162,74,.5);

  pointer-events:none;
}

.hero-inner{
  position:relative;
  z-index:2;
}

.hero-bismillah{
  font-family:Georgia,serif;
  font-size:25px;
  margin-bottom:25px;
}

.hero-small{
  font-size:10px;
  letter-spacing:5px;
  color:#98743a;
  margin-bottom:18px;
}

.hero h1{
  font-family:Georgia,serif;
  font-weight:normal;
  color:#641f2b;
  font-size:55px;
  line-height:1.25;
}

.hero-date{
  margin-top:25px;
  color:#725d4f;
}


/* ================= PEMBUKA ================= */

.opening{
  position:relative;
  background:#fffaf3;
  text-align:center;
}

.section-title{
  text-align:center;
  margin-bottom:35px;
}

.section-title h2{
  font-family:Georgia,serif;
  font-weight:normal;
  color:#641f2b;
  font-size:34px;
  margin-bottom:12px;
}

.section-title p{
  color:#806f64;
  font-size:14px;
  line-height:1.8;
}

.opening-text{
  max-width:600px;
  margin:auto;

  font-family:Georgia,serif;
  font-size:16px;
  line-height:2;
}

.quote{
  margin-top:25px;

  font-size:13px;
  line-height:1.9;

  font-style:italic;
  color:#88776d;
}


/* ================= MEMPELAI ================= */

.couple{
  position:relative;
  background:#f2e5d3;
  text-align:center;
}

.couple-title{
  font-family:Georgia,serif;
  font-size:36px;
  font-weight:normal;
  color:#641f2b;
  margin-bottom:40px;
}

.bride,
.groom{
  position:relative;

  padding:35px 20px;
  margin-bottom:20px;

  background:#fffaf4;

  border:1px solid rgba(201,162,74,.55);

  box-shadow:
    0 15px 40px rgba(80,45,25,.1);
}

.bride:before,
.groom:before{
  content:"✦";

  position:absolute;
  top:12px;
  left:50%;

  transform:translateX(-50%);

  color:#c9a24a;
}

.couple-name{
  font-family:Georgia,serif;
  font-size:38px;
  font-weight:normal;
  color:#641f2b;
  margin-bottom:12px;
}

.couple-info{
  font-size:14px;
  line-height:1.8;
  color:#806f64;
}

.and{
  font-family:Georgia,serif;
  color:#c49a3a;
  font-size:30px;
  margin:0 0 20px;
}


/* ================= FOTO ================= */

.photo-section{
  background:#fffaf3;
}

.photo-frame{
  position:relative;

  padding:12px;

  background:#fff;

  border:1px solid #c9a24a;

  box-shadow:
    0 20px 50px rgba(70,40,20,.15);

  overflow:hidden;
}

.photo-frame:before{
  content:"";

  position:absolute;
  inset:6px;

  border:1px solid rgba(201,162,74,.6);

  pointer-events:none;
}

.photo-frame img{
  width:100%;
  height:520px;

  display:block;

  object-fit:cover;

  animation:photoZoom 8s ease-in-out infinite alternate;
}


/* ================= ACARA ================= */

.event{
  position:relative;
  background:#641f2b;
  color:white;
}

.event .section-title h2{
  color:#f4d98a;
}

.event .section-title p{
  color:#eaded4;
}

.event-card{
  background:#fffaf4;
  color:#49352d;

  padding:30px 20px;

  border:1px solid #c9a24a;

  box-shadow:
    0 20px 50px rgba(0,0,0,.2);
}

.event-item{
  text-align:center;
  padding:25px 0;

  border-bottom:1px solid #eadbc8;
}

.event-item:last-child{
  border-bottom:0;
}

.event-icon{
  font-size:27px;
  margin-bottom:10px;
}

.event-item h3{
  font-family:Georgia,serif;
  font-size:21px;
  font-weight:normal;
  color:#641f2b;
  margin-bottom:8px;
}

.event-item p{
  font-size:14px;
  line-height:1.8;
}

.map-btn{
  display:inline-block;

  margin-top:15px;
  padding:11px 23px;

  border-radius:25px;

  background:#641f2b;
  color:white;

  text-decoration:none;
}


/* ================= LOVE STORY ================= */

.story{
  background:#f2e5d3;
}

.story-card{
  position:relative;

  padding:32px;

  background:#fffaf4;

  border:1px solid rgba(201,162,74,.6);

  line-height:2;
  font-size:14px;

  box-shadow:
    0 15px 40px rgba(80,45,25,.08);

  white-space:pre-line;
}

.story-card:before{
  content:"❦";

  display:block;

  text-align:center;

  color:#c9a24a;

  font-size:28px;

  margin-bottom:15px;
}


/* ================= WEDDING GIFT ================= */

.gift{
  background:#fffaf3;
}

.gift-card{
  padding:38px 20px;

  background:
    linear-gradient(
      145deg,
      #f8eddd,
      #fffaf3
    );

  border:1px solid #c9a24a;

  text-align:center;

  box-shadow:
    0 15px 40px rgba(70,40,20,.1);
}

.bank{
  font-family:Georgia,serif;
  color:#641f2b;
  font-size:23px;
}

.account{
  margin-top:15px;
  font-size:23px;
  letter-spacing:2px;
}

.copy-btn{
  margin-top:22px;

  padding:11px 23px;

  border:0;
  border-radius:25px;

  background:#641f2b;
  color:white;

  cursor:pointer;
}

.copy-message{
  margin-top:12px;
  font-size:13px;
}


/* ================= PENUTUP ================= */

.closing{
  position:relative;

  text-align:center;

  background:
    linear-gradient(
      135deg,
      #3f2527,
      #641f2b
    );

  color:white;

  padding:90px 20px;

  overflow:hidden;
}

.closing h2{
  font-family:Georgia,serif;
  font-size:38px;
  font-weight:normal;
  color:#f4d98a;
  margin-bottom:22px;
}

.closing p{
  font-size:14px;
  line-height:2;
  color:#f5e9df;
}


/* ================= LOADING ================= */

.loading{
  position:fixed;
  inset:0;
  z-index:10000;

  display:flex;
  align-items:center;
  justify-content:center;

  background:#f6efe3;

  color:#641f2b;

  font-family:Georgia,serif;
}

.error{
  text-align:center;
  padding:30px;
}


/* ================= ANIMASI SCROLL ================= */

.reveal{
  opacity:0;
  transform:translateY(45px);

  transition:
    opacity 1s ease,
    transform 1s ease;
}

.reveal.show{
  opacity:1;
  transform:translateY(0);
}

@keyframes coverIn{
  from{
    opacity:0;
    transform:translateY(30px) scale(.96);
  }

  to{
    opacity:1;
    transform:translateY(0) scale(1);
  }
}

@keyframes photoZoom{
  from{
    transform:scale(1);
  }

  to{
    transform:scale(1.06);
  }
}


/* ================= MOBILE ================= */

@media(max-width:600px){

  section{
    padding:65px 15px;
  }

  .cover h1{
    font-size:40px;
  }

  .hero h1{
    font-size:43px;
  }

  .hero:before{
    inset:12px;
  }

  .photo-frame img{
    height:430px;
  }

  .couple-name{
    font-size:32px;
  }

  .section-title h2{
    font-size:30px;
  }

}

</style>
</head>


<body>

<!-- LOADING -->

<div id="loading" class="loading">
  ✦ Menyiapkan undangan...
</div>


<div id="app" style="display:none;">


<!-- ================= COVER ================= -->

<div class="cover" id="cover">

  <div class="cover-card">

    <div class="songket top"></div>

    <div class="bismillah">
      بِسْمِ اللّٰهِ الرَّحْمٰنِ الرَّحِيْمِ
    </div>

    <div class="cover-small">
      THE WEDDING OF
    </div>

    <h1 id="coverNames">
      Fitria & Agung
    </h1>

    <p class="cover-date" id="coverDate
