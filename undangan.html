<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Undangan Pernikahan</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase.js"></script>

<style>
body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#faf7f2;
  color:#493d34;
}

.container{
  max-width:700px;
  margin:auto;
  text-align:center;
  padding:40px 20px;
}

.card{
  background:white;
  padding:30px 20px;
  border-radius:20px;
  box-shadow:0 5px 20px rgba(0,0,0,.08);
}

img{
  width:100%;
  max-height:450px;
  object-fit:cover;
  border-radius:15px;
  margin:20px 0;
}

h1{
  font-family:Georgia,serif;
  font-size:40px;
  font-weight:normal;
}

h2{
  font-family:Georgia,serif;
  font-weight:normal;
}

.info{
  margin:25px 0;
  line-height:1.8;
}

.story{
  text-align:left;
  line-height:1.8;
  white-space:pre-line;
}

.rekening{
  background:#eee2d2;
  padding:20px;
  border-radius:15px;
  margin-top:25px;
}

audio{
  width:100%;
  margin-top:20px;
}

.loading{
  text-align:center;
  padding:50px 20px;
}

.error{
  color:#a33;
  text-align:center;
  padding:50px 20px;
}
</style>
</head>

<body>

<div id="app">

<div class="loading">
⏳ Membuka undangan...
</div>

</div>


<script>

async function tampilkanUndangan(){

const app =
document.getElementById("app");


try{

if(
typeof supabaseClient === "undefined" ||
!supabaseClient
){

throw new Error(
"Supabase belum terhubung."
);

}


/* AMBIL SLUG DARI LINK */

const params =
new URLSearchParams(
window.location.search
);

const slug =
params.get("slug");


if(!slug){

throw new Error(
"Slug undangan tidak ditemukan."
);

}


/* CARI DATA */

const result =
await supabaseClient
.from("UNDANGAN")
.select("*")
.eq("slug",slug)
.single();


if(result.error){

throw new Error(
"Undangan tidak ditemukan."
);

}


const data =
result.data;


/* TAMPILKAN */

app.innerHTML = `

<div class="container">

<div class="card">

<p>
THE WEDDING OF
</p>

<h1>
${data.nama_pria}
<br>
&
<br>
${data.nama_wanita}
</h1>


${
data.foto_url
?
`<img src="${data.foto_url}" alt="Foto Pengantin">`
:
""
}


<div class="info">

<h2>
💍 Detail Acara
</h2>

<p>
📅 ${data.tanggal_acara}
</p>

<p>
⏰ ${data.jam_acara}
</p>

<p>
📍 ${data.lokasi}
</p>

</div>


<div class="story">

<h2>
💖 Love Story
</h2>

<p>
${data.love_story}
</p>

</div>


<div class="rekening">

<h2>
💳 Wedding Gift
</h2>

<p>
${data.nama_rekening}
</p>

<p>
<strong>
${data.rekening}
</strong>
</p>

</div>


${
data.musik_ur
?
`
<audio controls>
<source src="${data.musik_ur}">
Browser tidak mendukung audio.
</audio>
`
:
""
}


</div>

</div>

`;

}

catch(error){

app.innerHTML = `

<div class="error">

<h2>
❌ ${error.message}
</h2>

<p>
Periksa kembali link undangan.
</p>

</div>

`;

}

}


tampilkanUndangan();

</script>

</body>
</html>
