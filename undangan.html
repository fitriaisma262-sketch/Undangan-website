<!DOCTYPE html>
<html lang="id">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0"
>

<title>Undangan Pernikahan</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="supabase.js"></script>


<style>

*{
box-sizing:border-box;
}

body{
margin:0;
font-family:Arial,sans-serif;
background:#faf7f2;
color:#493d34;
}

.container{
max-width:700px;
margin:auto;
padding:40px 20px;
}

.card{
background:white;
padding:30px 20px;
border-radius:20px;
box-shadow:0 5px 20px rgba(0,0,0,.08);
text-align:center;
}

.card>p:first-child{
letter-spacing:3px;
font-size:12px;
}

h1{
font-family:Georgia,serif;
font-size:42px;
font-weight:normal;
line-height:1.3;
}

h2{
font-family:Georgia,serif;
font-weight:normal;
}

img{
width:100%;
max-height:450px;
object-fit:cover;
border-radius:15px;
margin:20px 0;
}

.info{
margin:30px 0;
line-height:1.8;
}

.story{
margin-top:30px;
padding-top:25px;
border-top:1px solid #eee;
text-align:left;
line-height:1.8;
}

.rekening{
background:#eee2d2;
padding:20px;
border-radius:15px;
margin-top:30px;
}

audio{
width:100%;
margin-top:25px;
}

.loading{
text-align:center;
padding:60px 20px;
}

.error{
text-align:center;
padding:60px 20px;
color:#a33;
}

</style>

</head>


<body>


<div id="app">

<div class="loading">
⏳ Membuka undangan...
</div>

</div>



<script>

async function tampilkanUndangan(){

const app =
document.getElementById("app");


try{


/* CEK SUPABASE */

if(
typeof supabaseClient === "undefined" ||
!supabaseClient
){

throw new Error(
"Supabase belum terhubung."
);

}


/* AMBIL SLUG */

const params =
new URLSearchParams(
window.location.search
);

const slug =
params.get("slug");


if(!slug){

throw new Error(
"Slug undangan tidak ditemukan."
);

}


/* AMBIL DATA */

const result =
await supabaseClient
.from("UNDANGAN")
.select("*")
.eq("slug",slug)
.single();


if(result.error){

throw new Error(
"Undangan tidak ditemukan."
);

}


const data =
result.data;


/* FOTO */

let fotoHTML = "";

if(data.foto_url){

fotoHTML = `
<img
src="${data.foto_url}"
alt="Foto Pengantin"
>
`;

}


/* MUSIK */

let musikHTML = "";

if(data.musik_ur){

musikHTML = `
<audio controls autoplay loop>
<source
src="${data.musik_ur}"
>
Browser tidak mendukung musik.
</audio>
`;

}


/* TAMPILKAN */

app.innerHTML = `

<div class="container">

<div class="card">


<p>
THE WEDDING OF
</p>


<h1>

${data.nama_pria}

<br>

&

<br>

${data.nama_wanita}

</h1>


${fotoHTML}


<div class="info">

<h2>
💍 Detail Acara
</h2>

<p>
📅 <strong>Tanggal</strong>
<br>
${data.tanggal_acara}
</p>

<p>
⏰ <strong>Waktu</strong>
<br>
${data.jam_acara}
</p>

<p>
📍 <strong>Lokasi</strong>
<br>
${data.lokasi}
</p>

</div>



<div class="story">

<h2>
💖 Love Story
</h2>

<p>
${data.love_story}
</p>

</div>



<div class="rekening">

<h2>
💳 Wedding Gift
</h2>

<p>
${data.nama_rekening}
</p>

<p>
Nomor Rekening:
<br>

<strong>
${data.rekening}
</strong>

</p>

</div>


${musikHTML}


</div>

</div>

`;

}


catch(error){

app.innerHTML = `

<div class="error">

<h2>
❌ ${error.message}
</h2>

<p>
Silakan periksa kembali link undangan.
</p>

</div>

`;

}

}


tampilkanUndangan();

</script>


</body>

</html>
