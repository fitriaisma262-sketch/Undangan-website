<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Buat Undangan</title>

<style>
body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#faf7f2;
  color:#493d34;
}

.container{
  max-width:600px;
  margin:auto;
  padding:25px;
}

h1{
  font-family:Georgia,serif;
  text-align:center;
  font-weight:normal;
}

label{
  display:block;
  margin-top:18px;
  margin-bottom:7px;
  font-weight:bold;
}

input,textarea,select{
  width:100%;
  padding:13px;
  border:1px solid #d5c9bc;
  border-radius:10px;
  font-size:16px;
  box-sizing:border-box;
}

textarea{
  min-height:120px;
}

button{
  width:100%;
  margin-top:25px;
  padding:15px;
  border:0;
  border-radius:30px;
  background:#876f52;
  color:white;
  font-size:16px;
}

#hasil{
  margin-top:20px;
  padding:15px;
  border-radius:10px;
  background:#eee2d2;
  display:none;
  line-height:1.6;
}
</style>
</head>

<body>

<div class="container">

<h1>💍 Buat Undangan</h1>

<p style="text-align:center;">
Isi data pasanganmu untuk membuat undangan digital.
</p>

<label>Nama Pengantin Wanita</label>
<input id="nama_wanita" type="text" placeholder="Contoh: Fitria">

<label>Nama Pengantin Pria</label>
<input id="nama_pria" type="text" placeholder="Contoh: Andi">

<label>Tanggal Acara</label>
<input id="tanggal_acara" type="date">

<label>Jam Acara</label>
<input id="jam_acara" type="time">

<label>Lokasi Acara</label>
<input id="lokasi" type="text" placeholder="Contoh: Gedung Pernikahan">

<label>Love Story</label>
<textarea id="love_story" placeholder="Ceritakan kisah cinta kalian..."></textarea>

<label>Pilih Template</label>

<select id="template">
  <option value="floral">🌸 Floral</option>
  <option value="classic">🤎 Classic</option>
  <option value="emerald">💚 Emerald</option>
  <option value="luxury">✨ Luxury</option>
</select>

<button onclick="buatUndangan()">
Buat Undangan
</button>

<div id="hasil"></div>

</div>

<script>

const SUPABASE_URL =
"https://yacmjyomakfdkmxeihbb.supabase.co";

const SUPABASE_KEY =
"sb_publishable_T67eRn0MhIBTZxOv07gyRA_e9kiK_Wo";


async function buatUndangan(){

  const namaWanita =
    document.getElementById("nama_wanita").value.trim();

  const namaPria =
    document.getElementById("nama_pria").value.trim();

  const tanggal =
    document.getElementById("tanggal_acara").value;

  const jam =
    document.getElementById("jam_acara").value;

  const lokasi =
    document.getElementById("lokasi").value.trim();

  const loveStory =
    document.getElementById("love_story").value.trim();

  const template =
    document.getElementById("template").value;


  if(!namaWanita || !namaPria){

    alert("Nama pengantin wajib diisi.");

    return;

  }


  const slug =
    (namaWanita + "-" + namaPria)
    .toLowerCase()
    .replace(/[^a-z0-9]+/g,"-")
    .replace(/^-+|-+$/g,"");


  const data = {

    nama_wanita: namaWanita,

    nama_pria: namaPria,

    tanggal_acara: tanggal,

    jam_acara: jam,

    lokasi: lokasi,

    kisah_cinta: loveStory,

    foto_url: "",

    musik_url: "",

    rekening: "",

    nama_rekening: "",

    slug: slug,

    template: template,

    status: "draft",

    WhatsApp: ""

  };


  const hasil =
    document.getElementById("hasil");

  hasil.style.display = "block";

  hasil.innerHTML =
    "⏳ Menyimpan data...";


  try{

    const response = await fetch(

      SUPABASE_URL +
      "/rest/v1/undangan",

      {

        method:"POST",

        headers:{

          "Content-Type":
          "application/json",

          "apikey":
          SUPABASE_KEY,

          "Authorization":
          "Bearer " + SUPABASE_KEY,

          "Prefer":
          "return=minimal"

        },

        body:
        JSON.stringify(data)

      }

    );


    if(!response.ok){

      const errorText =
        await response.text();

      console.error(errorText);

      throw new Error(errorText);

    }


    hasil.innerHTML =
      "✅ <b>Data berhasil disimpan!</b><br><br>" +
      "Slug: <b>" + slug + "</b>";


  }catch(error){

    console.error(error);

    hasil.innerHTML =
      "❌ <b>Data gagal disimpan.</b><br><br>" +
      error.message;

  }

}

</script>

</body>
</html>
