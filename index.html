<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Undangan Digital Fitria</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}

body{
  font-family:Arial,sans-serif;
  background:#faf7f2;
  color:#493d34;
}

header{
  padding:25px 7%;
  display:flex;
  justify-content:space-between;
  align-items:center;
  background:#fff;
}

.logo{
  font-family:Georgia,serif;
  font-size:24px;
}

nav a{
  margin-left:20px;
  text-decoration:none;
  color:#493d34;
}

.hero{
  text-align:center;
  padding:90px 20px;
  background:#eee2d2;
}

.hero h1{
  font-family:Georgia,serif;
  font-size:48px;
  font-weight:normal;
  margin-bottom:15px;
}

.hero p{
  max-width:550px;
  margin:auto;
  line-height:1.8;
}

.btn{
  display:inline-block;
  margin-top:25px;
  padding:13px 25px;
  border-radius:30px;
  background:#876f52;
  color:white;
  text-decoration:none;
}

section{
  padding:70px 7%;
}

.title{
  text-align:center;
  margin-bottom:40px;
}

.title h2{
  font-family:Georgia,serif;
  font-size:35px;
  font-weight:normal;
}

.templates{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(230px,1fr));
  gap:25px;
}

.template{
  background:white;
  border-radius:18px;
  overflow:hidden;
  box-shadow:0 7px 25px rgba(0,0,0,.08);
}

.preview{
  height:300px;
  display:flex;
  justify-content:center;
  align-items:center;
  text-align:center;
  padding:20px;
}

.floral{background:#eee0d0}
.classic{background:#e8dfd5}
.emerald{background:#dce8df}
.luxury{background:#e5dfd4}

.preview h3{
  font-family:Georgia,serif;
  font-size:30px;
  font-weight:normal;
}

.info{
  padding:22px;
}

.info h3{
  margin-bottom:8px;
}

.info p{
  color:#777;
  font-size:14px;
}

.price{
  font-size:22px;
  font-weight:bold;
  margin-top:15px;
}

.features{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
  gap:18px;
}

.feature{
  background:white;
  padding:25px;
  border-radius:16px;
  text-align:center;
}

.feature span{
  font-size:30px;
}

.order{
  text-align:center;
  background:#eee2d2;
}

footer{
  padding:35px;
  text-align:center;
  background:#493d34;
  color:white;
}
</style>
</head>

<body>

<header>

<div class="logo">
Fitria Invitation
</div>

<nav>
<a href="#template">Template</a>
<a href="#fitur">Fitur</a>
<a href="#pesan">Pesan</a>
</nav>

</header>


<section class="hero">

<h1>
Undangan Digital
</h1>

<p>
Buat hari istimewa semakin berkesan
dengan undangan digital yang elegan,
modern dan mudah dibagikan.
</p>

<a class="btn" href="#template">
Lihat Template
</a>

</section>


<section id="template">

<div class="title">

<h2>
Pilih Template
</h2>

<p>
Temukan desain yang paling cocok untuk hari bahagiamu.
</p>

</div>


<div class="templates">


<div class="template">

<div class="preview floral">

<div>

<p>THE WEDDING OF</p>

<h3>
Fitria
<br>
&
<br>
Pasangan
